name: CI pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    unit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true
            - run: make lint
            - run: make test
    
    integration:
        runs-on: ubuntu-latest
        needs: unit
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true
            - run: make test-int
            - name: Show logs on failure
              if: failure()
              run: docker compose -f docker-compose-logs.yml logs
            - name: Tear down
              if: always()
              run: make test-down