services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=test
    ports: ["55432:5432"]
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    tmpfs: /var/lib/postgres/db
  redis:
    image: redis:7
    ports: ["56379:56379"]
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["55672:5672"]

  kafka:
    image: apache/kafka:3.8.0
    ports: ["59092:9092"]